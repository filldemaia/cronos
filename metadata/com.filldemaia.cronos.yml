Description: |-
  Cronos mostra l'hora de la manera tradicional catalana
  ("És un quart de set del matí", "Falten cinc minuts per les tres
  de la tarda"), amb un degradat de fons que canvia segons el
  moment del dia.

  * Hora catalana completa amb quarts, minuts, segons i moment del dia
  * Data completa amb el dia de la setmana
  * Salutació segons el moment del dia
  * Tres widgets per a la pantalla d'inici
  * Segons opcionals, per escrit a la frase tradicional
  * Mida de l'hora ajustable i configuració restableixible
  * Molt eficient: una sola alarma per minut, sense permisos especials

  Cronos no recull cap dada i funciona 100% sense connexió. Codi
  lliure sota GPL v3 o posterior.
